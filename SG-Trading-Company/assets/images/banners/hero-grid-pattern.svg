<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Refined 40px Engineering Grid -->
    <pattern id="cleanGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C98249" stroke-width="0.8" stroke-opacity="0.06" />
    </pattern>
    <!-- 200px Architectural Modular Unit -->
    <pattern id="archGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#cleanGrid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#C98249" stroke-width="1.2" stroke-opacity="0.14" />
      <!-- Precision CAD Crosshair Markers -->
      <path d="M -8 0 L 8 0 M 0 -8 L 0 8" fill="none" stroke="#C98249" stroke-width="1.2" stroke-opacity="0.32" />
      <path d="M 92 100 L 108 100 M 100 92 L 100 108" fill="none" stroke="#C98249" stroke-width="1" stroke-opacity="0.22" />
      <circle cx="100" cy="100" r="1.5" fill="#C98249" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Deep Architectural Charcoal -->
  <rect width="400" height="400" fill="#222528" />

  <!-- Grid Layer -->
  <rect width="400" height="400" fill="url(#archGrid)" />

  <!-- Unique Elegant Drafting Angle Lines (Crisp & Clean) -->
  <line x1="0" y1="400" x2="400" y2="0" stroke="#C98249" stroke-width="0.75" stroke-opacity="0.07" stroke-dasharray="8 8" />
  <line x1="-100" y1="400" x2="300" y2="0" stroke="#C98249" stroke-width="0.5" stroke-opacity="0.05" stroke-dasharray="5 10" />
  <line x1="100" y1="400" x2="500" y2="0" stroke="#C98249" stroke-width="0.5" stroke-opacity="0.05" stroke-dasharray="5 10" />
</svg>